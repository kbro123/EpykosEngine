# Tests only (D12): Linux GCC 13 and macOS Apple clang, release preset; the reference preset on
# Linux as well, because E0 gates run under it. Benchmarks are built but never run in CI; perf
# gates run only locally and are fingerprinted (D9, D13).
name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: release
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            preset: reference
            cc: gcc-13
            cxx: g++-13
          - os: macos-latest
            preset: release
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-13 g++-13

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache third_party downloads
        uses: actions/cache@v5
        with:
          path: .cache/downloads
          key: third-party-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: Bootstrap third_party
        run: scripts/bootstrap.sh

      - name: Toolchain
        run: |
          $CXX --version
          cmake --version
          ninja --version
          scripts/fingerprint.sh

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
